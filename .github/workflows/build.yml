name: build-module
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ThermalFast-App-Project.zip -d proj
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.13 }
      - run: gradle :app:assembleRelease
        working-directory: proj
      - run: |
          cp -r proj/module-src module && mkdir -p module/app
          cp proj/app/build/outputs/apk/release/app-release.apk module/app/ThermalFast.apk
          cd module && zip -r ../ThermalFast-Module.zip .
      - uses: actions/upload-artifact@v4
        with: { name: ThermalFast-Module, path: ThermalFast-Module.zip }